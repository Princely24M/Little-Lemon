{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Lemon{% block title %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=Markazi+Text:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
<div class="page">
  <header>
    <img src="{% static 'img/lemon.svg' %}" alt="Little Lemon logo">
    <span class="brand">LITTLE LEMON</span>
  </header>
  <nav>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'about' %}">About</a>
    <a href="{% url 'menu' %}">Menu</a>
    <a href="{% url 'book' %}">Book</a>
    <a href="{% url 'reservations' %}">Reservations</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <div class="foot-logo"><img src="{% static 'img/lemon.svg' %}" alt=""></div>
    <div class="foot-right">Copyright Little Lemon</div>
  </footer>
</div>
</body>
</html>
